name: Static Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  HTSLIB_VERSION: "1.23.1"
  FELIXLA_CXXFLAGS: "-O3 -std=c++17 -Wall -Wextra -Wpedantic"

jobs:
  linux-x86-64:
    name: linux-x86_64 static binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            bzip2 \
            ca-certificates \
            curl \
            file \
            libbz2-dev \
            libdeflate-dev \
            liblzma-dev \
            make \
            pkg-config \
            python3 \
            zlib1g-dev

      - name: Build static htslib with libdeflate and without libcurl
        run: |
          set -euo pipefail
          curl -L \
            "https://github.com/samtools/htslib/releases/download/${HTSLIB_VERSION}/htslib-${HTSLIB_VERSION}.tar.bz2" \
            -o /tmp/htslib.tar.bz2
          mkdir -p /tmp/htslib-src
          tar -xjf /tmp/htslib.tar.bz2 -C /tmp/htslib-src --strip-components=1
          cd /tmp/htslib-src
          # --with-libdeflate rather than the default autodetection: libdeflate
          # is most of the decompression speed, and a missing dev package
          # should fail the release rather than quietly halve it.
          ./configure \
            --prefix=/opt/htslib-static \
            --with-libdeflate \
            --disable-libcurl \
            --disable-s3 \
            --disable-gcs \
            --disable-plugins
          make -j"$(nproc)"
          sudo make install

      - name: Build and test static binaries
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH=/opt/htslib-static/lib/pkgconfig
          make static STATIC_FULLY=1 CXXFLAGS="${FELIXLA_CXXFLAGS}"
          make test-static STATIC_FULLY=1 CXXFLAGS="${FELIXLA_CXXFLAGS}"
          python3 tests/run_keep_extract_intense.py --bin-dir "${PWD}/bin-static"
          python3 tests/run_concat_intense.py --bin-dir "${PWD}/bin-static"
          python3 tests/run_scalar_equivalence.py --bin-dir "${PWD}/bin-static"
          file bin-static/felixla
          file bin-static/vcf_tbi_chunks
          ldd bin-static/felixla 2>&1 | tee /tmp/ldd.txt || true
          grep -q "not a dynamic executable" /tmp/ldd.txt
          ldd bin-static/vcf_tbi_chunks 2>&1 | tee /tmp/ldd-chunks.txt || true
          grep -q "not a dynamic executable" /tmp/ldd-chunks.txt
          mkdir -p dist
          cp bin-static/felixla dist/felixla-linux-x86_64-static
          cp bin-static/vcf_tbi_chunks dist/vcf_tbi_chunks-linux-x86_64-static
          strip dist/felixla-linux-x86_64-static dist/vcf_tbi_chunks-linux-x86_64-static
          dist/felixla-linux-x86_64-static --version
          dist/vcf_tbi_chunks-linux-x86_64-static --version
          file dist/felixla-linux-x86_64-static
          file dist/vcf_tbi_chunks-linux-x86_64-static
          ldd dist/felixla-linux-x86_64-static 2>&1 | tee /tmp/ldd-stripped.txt || true
          grep -q "not a dynamic executable" /tmp/ldd-stripped.txt
          ldd dist/vcf_tbi_chunks-linux-x86_64-static 2>&1 | tee /tmp/ldd-chunks-stripped.txt || true
          grep -q "not a dynamic executable" /tmp/ldd-chunks-stripped.txt
          (
            cd dist
            sha256sum felixla-linux-x86_64-static > felixla-linux-x86_64-static.sha256
            sha256sum vcf_tbi_chunks-linux-x86_64-static > vcf_tbi_chunks-linux-x86_64-static.sha256
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: felixla-linux-x86_64-static
          path: |
            dist/felixla-linux-x86_64-static
            dist/felixla-linux-x86_64-static.sha256
            dist/vcf_tbi_chunks-linux-x86_64-static
            dist/vcf_tbi_chunks-linux-x86_64-static.sha256

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          # The release page carries the README's upgrade notes for this tag,
          # so what a release breaks is visible where people download it and
          # not only in the repository. A tag with no such section falls back
          # to the default line rather than inheriting the previous release's
          # notes, which would be worse than having none.
          notes="$(mktemp)"
          set +e
          python3 .github/release-notes.py "${tag}" README.md >"${notes}"
          notes_status=$?
          set -e
          if [ "${notes_status}" -eq 0 ] && [ -s "${notes}" ]; then
            echo "Release notes taken from the README upgrade section for ${tag}."
          elif [ "${notes_status}" -eq 3 ]; then
            printf 'No behaviour changes recorded for this release.\n' >"${notes}"
            echo "No README upgrade section for ${tag}; using the default note."
          else
            # Only 3 means "no section". Anything else -- a syntax error, a
            # missing README, a python that will not run it -- is the script
            # being broken, and publishing the default note would hide that
            # behind a plausible-looking release.
            echo "release-notes.py failed with status ${notes_status}" >&2
            exit 1
          fi
          {
            printf '\n---\n\n'
            printf 'Linux x86_64 static binaries: `felixla` and `vcf_tbi_chunks`.\n'
            printf 'Verify with the `.sha256` file beside each one.\n'
          } >>"${notes}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" --notes-file "${notes}"
          else
            gh release create "${tag}" --title "${tag}" --notes-file "${notes}"
          fi
          gh release upload "${tag}" \
            dist/felixla-linux-x86_64-static \
            dist/felixla-linux-x86_64-static.sha256 \
            dist/vcf_tbi_chunks-linux-x86_64-static \
            dist/vcf_tbi_chunks-linux-x86_64-static.sha256 \
            --clobber
